[package]
name = "pubsub"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
config = { path = "../config" }
futures-util = "0.3"
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
