services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"

  postgres-admin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  chat-node:
    build: .
    depends_on:
      - redis
      - postgres
    environment:
      - PORT=${PORT}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - REGION=${REGION}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${PORT}"
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - target/
            - .git/
            - docker-compose.yml
            - Dockerfile
            - README.md